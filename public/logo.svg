<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%" fill="none">
  <!-- ZenScout AI Minimalist Logo Lockup - Aneevarp Master Palette -->
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#476550" />
      <stop offset="100%" stop-color="#A2BCA8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2BCA8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#476550" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left: Minimalist A-Scout Icon Mark -->
  <g transform="translate(40, 10)">
    <!-- Radar Sector Sweep (Subtle) -->
    <path d="M 80 80 L 140 20 A 80 80 0 0 0 80 0 Z" fill="url(#glowGrad)" />

    <!-- Outer Radar Scope Ring -->
    <circle cx="80" cy="80" r="70" stroke="#476550" stroke-width="5" stroke-linecap="round" />
    
    <!-- Inner Concentric Arc -->
    <circle cx="80" cy="80" r="46" stroke="#476550" stroke-width="3" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Cardinal Radar Ticks -->
    <line x1="80" y1="2" x2="80" y2="18" stroke="#476550" stroke-width="4" stroke-linecap="round" />
    <line x1="80" y1="142" x2="80" y2="158" stroke="#476550" stroke-width="4" stroke-linecap="round" />
    <line x1="2" y1="80" x2="18" y2="80" stroke="#476550" stroke-width="4" stroke-linecap="round" />
    <line x1="142" y1="80" x2="158" y2="80" stroke="#476550" stroke-width="4" stroke-linecap="round" />

  <!-- Minimalist Aneevarp Apex "A" Delta -->
  <path d="M 45 125 L 80 32 L 115 125" stroke="url(#sageGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="58" y1="92" x2="102" y2="92" stroke="url(#sageGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Central AI Node Spark -->
  <circle cx="80" cy="80" r="8" fill="#A2BCA8" stroke="#476550" stroke-width="2.5" />
  </g>

  <!-- Right: Modern Geometric Typography -->
  <g transform="translate(240, 96)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="#1A1F1F">
      ZenScout <tspan fill="#476550">AI</tspan>
    </text>

    <!-- Subtitle: Aneevarp Solutions -->
    <text x="3" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3.5" fill="#7D8787">
      BY ANEEVARP SOLUTIONS
    </text>
  </g>
</svg>
